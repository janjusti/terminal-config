"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = """$time$username@${custom.host}${custom.docker-host} $sudo\\($shell$shlvl\\) \\[$directory\\] $cmd_duration [$all](dimmed)$character"""
scan_timeout = 20
command_timeout = 100

[container]
disabled = true

[hostname]
disabled = true

[shell]
format = '[$indicator]($style)'
bash_indicator = """[bash](green)"""
zsh_indicator = """[zsh](bright-blue)"""
powershell_indicator = """[pshell](yellow)"""
style = 'white'
unknown_indicator = "shell?"
disabled = false

[shlvl]
disabled = false
threshold = 2
symbol = '↕'
format = '[, $symbol$shlvl]($style)'
style = 'bold yellow'

[username]
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style)"
disabled = false
show_always = true

[cmd_duration]
min_time = 0
show_milliseconds = true
disabled = false
style = "gray dimmed"
format = "[<$duration>]($style)"

[time]
disabled = false
format = '[\[$time\]]($style) '
style = "fg:bright-black"
time_format = '%T'

[sudo]
format = '$symbol ($style)'
symbol = '🧙'
style = 'bold blue'
disabled = false

[directory]
truncation_length = 2
truncate_to_repo = true
truncation_symbol = '.../'
format = '[$path]($style)[$read_only]($read_only_style)'

[python]
format = 'via ${symbol}[($virtualenv)]($style) '

[custom.docker-host]
command = "echo $DOCKER_HOST | cut -d':' -f3"
when = ''' test "$DOCKER_HOST" != "" '''
symbol = '🐳'
format = '@$symbol[:$output]($style)'
style = 'bright-blue'

# Starship's built-in hostname module only supports a fixed style. This custom
# module derives a stable 256-color value from the displayed (short) hostname.
[custom.host]
command = '''
host=${STARSHIP_TEST_HOSTNAME:-$(hostname)}
host=${host%%.*}
host=$(printf '%s' "$host" | LC_ALL=C tr -cd '[:alnum:]_.-')
[ -n "$host" ] || host=unknown
checksum=$(printf '%s' "$host" | cksum)
checksum=${checksum%% *}
color=$((16 + 36 * (1 + checksum % 5) + 6 * (1 + (checksum / 5) % 5) + (1 + (checksum / 25) % 5)))
ssh_symbol=
if [ -n "${SSH_CONNECTION:-}${SSH_CLIENT:-}${SSH_TTY:-}" ]; then
    ssh_symbol='🌏'
fi
printf '%%{\033[1;38;5;%sm%%}%s%%{\033[0m%%}' "$color" "$host$ssh_symbol"
'''
when = true
shell = ['sh']
unsafe_no_escape = true
format = '$output'
style = ''
